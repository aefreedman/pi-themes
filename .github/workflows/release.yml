name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use supported npm
        run: npm install --global npm@^11.5.1
      - name: Verify toolchain
        run: |
          node --version
          npm --version
          npm_version="$(npm --version)"
          node --input-type=module - "$npm_version" <<'NODE'
          const atLeast = (actual, required) => {
            const a = actual.replace(/^v/, '').split('.').map(Number);
            const r = required.split('.').map(Number);
            for (let i = 0; i < r.length; i += 1) {
              if (a[i] > r[i]) return true;
              if (a[i] < r[i]) return false;
            }
            return true;
          };
          if (!atLeast(process.version, '22.14.0') || !atLeast(process.argv[2], '11.5.1')) process.exit(1);
          NODE
      - run: npm publish
